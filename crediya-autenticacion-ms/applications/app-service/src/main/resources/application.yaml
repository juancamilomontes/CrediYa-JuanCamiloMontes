server:
  port: 8080
spring:
  application:
    name: "crediya-autenticacion-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    # PostgreSQL 17 en Docker (WSL): contenedor postgres_local, base mydb.
    url: "jdbc:postgresql://localhost:5432/mydb"
    username: "postgres"
    password: "postgres"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
