server:
  port: 8080
spring:
  application:
    name: "crediya-autenticacion-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    # PostgreSQL 17 en Docker (WSL): contenedor postgres_local, base mydb.
    # Se leen de variables de entorno; si no existen, usa los valores locales de desarrollo.
    url: "${DB_URL:jdbc:postgresql://localhost:5432/mydb}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  # Secreto compartido con el microservicio SOLICITUDES (HS256, mínimo 32 caracteres).
  # En producción va en AWS Secret Manager (ver diagrama de infraestructura).
  secret: "${JWT_SECRET:cambia-esta-clave-por-un-secreto-largo-y-seguro-crediya-2026}"
  expiration-millis: "${JWT_EXPIRATION_MILLIS:3600000}"
